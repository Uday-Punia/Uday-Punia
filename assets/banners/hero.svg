<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">Uday Punia — QA Automation Engineer</title>
  <desc id="d">Hi, I'm Uday Punia. QA Automation Engineer, SDET and Software Testing Engineer. Breaking bugs before they break production.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#141c26" stroke-width="1"/>
    </pattern>
    <radialGradient id="halo" cx="0.22" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#39ff88" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#39ff88" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo2" cx="0.85" cy="0.6" r="0.5">
      <stop offset="0" stop-color="#2f6bff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2f6bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" x2="1">
      <stop offset="0" stop-color="#39ff88"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#2f6bff"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.07"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="14" fill="#0b0f14"/>
  <rect width="1200" height="320" rx="14" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="14" fill="url(#halo)"/>
  <rect width="1200" height="320" rx="14" fill="url(#halo2)"/>

  <!-- slow scan sweep -->
  <rect x="0" y="-80" width="1200" height="80" fill="url(#sweep)">
    <animate attributeName="y" values="-80;320" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- HUD corners -->
  <g fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.7">
    <path d="M20 46V20H46M1154 20H1180V46M1180 274V300H1154M46 300H20V274"/>
  </g>

  <g font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace">
    <!-- top bar -->
    <text x="48" y="52" font-size="13" fill="#6b7a8c" letter-spacing="2">QA://COMMAND-CENTER</text>
    <g transform="translate(1000 47)">
      <circle r="5" fill="#39ff88"><animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <text x="14" y="5" font-size="13" fill="#39ff88" letter-spacing="2">SYSTEM ONLINE</text>
    </g>

    <!-- headline -->
    <text x="48" y="118" font-size="22" fill="#c9d4e0">Hi, I'm</text>
    <text x="46" y="182" font-size="60" font-weight="800" fill="#ffffff" font-family="'Segoe UI','Inter',Helvetica,Arial,sans-serif" letter-spacing="1">Uday Punia</text>
    <rect x="48" y="200" width="420" height="3" rx="1.5" fill="url(#rule)"/>

    <text x="48" y="236" font-size="18" fill="#22d3ee">QA Automation Engineer <tspan fill="#3c4a5a">|</tspan> SDET <tspan fill="#3c4a5a">|</tspan> Software Testing Engineer</text>
    <text x="48" y="274" font-size="18" fill="#39ff88" filter="url(#glow)">&gt; Breaking Bugs Before They Break Production<tspan fill="#39ff88">_<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/></tspan></text>

    <!-- pipeline panel (decorative, no metrics) -->
    <g transform="translate(830 92)">
      <rect width="320" height="186" rx="8" fill="#070a0e" stroke="#1f2a37"/>
      <text x="18" y="30" font-size="12" fill="#6b7a8c" letter-spacing="1.5">QUALITY PIPELINE</text>
      <g font-size="14">
        <g transform="translate(18 62)">
          <circle cx="6" cy="-5" r="6" fill="none" stroke="#39ff88" stroke-width="2"/>
          <text x="22" y="0" fill="#e6edf3">UI automation</text>
          <text x="296" y="0" text-anchor="end" fill="#6b7a8c" font-size="12">playwright · selenium</text>
        </g>
        <g transform="translate(18 96)">
          <circle cx="6" cy="-5" r="6" fill="none" stroke="#22d3ee" stroke-width="2"/>
          <text x="22" y="0" fill="#e6edf3">API validation</text>
          <text x="296" y="0" text-anchor="end" fill="#6b7a8c" font-size="12">postman · rest-assured</text>
        </g>
        <g transform="translate(18 130)">
          <circle cx="6" cy="-5" r="6" fill="none" stroke="#2f6bff" stroke-width="2"/>
          <text x="22" y="0" fill="#e6edf3">Performance</text>
          <text x="296" y="0" text-anchor="end" fill="#6b7a8c" font-size="12">jmeter</text>
        </g>
        <g transform="translate(18 164)">
          <circle cx="6" cy="-5" r="6" fill="none" stroke="#c9d4e0" stroke-width="2"/>
          <text x="22" y="0" fill="#e6edf3">CI/CD</text>
          <text x="296" y="0" text-anchor="end" fill="#6b7a8c" font-size="12">github actions · jenkins</text>
        </g>
      </g>
      <!-- active stage indicator cycles through the four stages -->
      <circle cx="24" cy="57" r="3" fill="#39ff88">
        <animate attributeName="cy" values="57;91;125;159;57" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
